# ACME account email.
email: "admin@example.com"

# Optional reports. Keep the bot token in an environment variable.
# notifications:
#   on: [renewed, error]
#   telegram:
#     bot_token: "${TELEGRAM_BOT_TOKEN}"
#     chat_id: -1001234567890
#     topic_id: 42 # optional

# Runtime state. Managed systemd setup replaces this with /var/lib/certgot.
storage_path: "/var/lib/certgot"
renew_before: "720h"
# Optional local ACME directory for development/testing. Production is default.
# acme_directory_url: "https://localhost:14000/dir"

# Use env_file for provider credentials. File format: KEY=value, mode 0600.
certificates:
  - domain: "example.com"
    provider: "cloudflare"
    env_file: "./cloudflare.env"
    permissions: "0640"
    group: "www-data"
    # Manual mode only. Managed setup rejects reload_units because its hardened
    # runtime user has no permission to control system services.
    # reload_units:
    #   - nginx.service
